<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Video Watermark Service</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard">
        <section class="upload-section">
            <h2>Add Watermark to Video</h2>
            <form id="upload-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="email">Watermark Email</label>
                    <input type="email" id="email" name="email" placeholder="user@example.com" required>
                    <small>The email will appear in each corner of the video</small>
                </div>
                <div class="form-group">
                    <label for="file">Select Video</label>
                    <input type="file" id="file" name="file" accept="video/*" required>
                    <small>MP4, MOV, MKV, AVI, WebM, GIF supported</small>
                </div>
                <div id="progress-container" class="hidden">
                    <div class="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                    <p id="status-text">Uploading...</p>
                </div>
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                <button type="submit" id="submit-btn">Upload & Process</button>
            </form>
        </section>

        <section class="jobs-section">
            <h2>Your Videos <button class="clear-all-btn" onclick="clearAllJobs()">Clear All</button></h2>
            <div id="jobs-list">
                <p class="loading">Loading...</p>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = '/api';

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        let accessToken = getCookie('access_token');

        async function fetchWithAuth(url, options = {}) {
            const headers = { ...options.headers };
            if (accessToken) {
                headers['Authorization'] = `Bearer ${accessToken}`;
            }
            return fetch(url, { ...options, headers, credentials: 'include' });
        }

        async function loadJobs() {
            const container = document.getElementById('jobs-list');
            try {
                const res = await fetchWithAuth(`${API_BASE}/jobs`);
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const jobs = await res.json();
                if (jobs.length === 0) {
                    container.innerHTML = '<p class="empty">No videos yet. Upload one above!</p>';
                    return;
                }
                container.innerHTML = jobs.map(job => `
                    <div class="job-card status-${job.status}" data-job-id="${job.id}">
                        <div class="job-info">
                            <strong>${escapeHtml(job.original_filename)}</strong>
                            <span class="job-email">${escapeHtml(job.email)}</span>
                            <span class="job-date">${new Date(job.created_at).toLocaleDateString()}</span>
                            ${job.status === 'processing' ? `
                                <div class="job-progress">
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${job.progress}%"></div>
                                    </div>
                                    <span class="progress-text">${job.progress}%</span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="job-status">
                            <span class="status-badge ${job.status}">${job.status}</span>
                            ${job.status === 'completed' ? `<a href="/download/${job.id}" class="download-btn">Download</a>` : ''}
                            ${job.status === 'failed' ? `<span class="error-msg">${escapeHtml(job.error_message || 'Unknown error')}</span>` : ''}
                            <button class="delete-btn" onclick="deleteJob(${job.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<p class="error">Failed to load jobs</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function pollJobStatus(jobId) {
            const interval = setInterval(async () => {
                const res = await fetchWithAuth(`${API_BASE}/jobs/${jobId}`);
                const job = await res.json();
                const card = document.querySelector(`.job-card[data-job-id="${jobId}"]`);
                if (!card) return;

                const statusBadge = card.querySelector(".status-badge");
                if (statusBadge) {
                    statusBadge.className = `status-badge ${job.status}`;
                    statusBadge.textContent = job.status;
                }

                if (job.status === 'processing') {
                    let progressDiv = card.querySelector(".job-progress");
                    if (!progressDiv) {
                        const jobInfo = card.querySelector(".job-info");
                        const progressHtml = `
                            <div class="job-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${job.progress}%"></div>
                                </div>
                                <span class="progress-text">${job.progress}%</span>
                            </div>
                        `;
                        jobInfo.insertAdjacentHTML('beforeend', progressHtml);
                        progressDiv = card.querySelector(".job-progress");
                    }
                    const progressFill = progressDiv.querySelector(".progress-fill");
                    const progressText = progressDiv.querySelector(".progress-text");
                    if (progressFill) progressFill.style.width = `${job.progress}%`;
                    if (progressText) progressText.textContent = `${job.progress}%`;
                }

                if (job.status === 'completed') {
                    clearInterval(interval);
                    const jobStatus = card.querySelector(".job-status");
                    if (jobStatus) {
                        jobStatus.innerHTML = `<span class="status-badge completed">completed</span> <a href="/download/${jobId}" class="download-btn">Download</a>`;
                    }
                    const progressDiv = card.querySelector(".job-progress");
                    if (progressDiv) progressDiv.remove();
                } else if (job.status === 'failed') {
                    clearInterval(interval);
                    const progressDiv = card.querySelector(".job-progress");
                    if (progressDiv) progressDiv.remove();
                }
            }, 1000);
        }

        async function deleteJob(jobId) {
            if (!confirm('Delete this video?')) return;
            try {
                const res = await fetchWithAuth(`${API_BASE}/jobs/${jobId}`, { method: 'DELETE' });
                if (res.ok) {
                    const card = document.querySelector(`.job-card[data-job-id="${jobId}"]`);
                    if (card) card.remove();
                    const container = document.getElementById('jobs-list');
                    if (container.querySelectorAll('.job-card').length === 0) {
                        container.innerHTML = '<p class="empty">No videos yet. Upload one above!</p>';
                    }
                }
            } catch (e) {
                alert('Failed to delete');
            }
        }

        async function clearAllJobs() {
            if (!confirm('Delete all videos? This cannot be undone.')) return;
            try {
                const res = await fetchWithAuth(`${API_BASE}/jobs`, { method: 'DELETE' });
                if (res.ok) {
                    document.getElementById('jobs-list').innerHTML = '<p class="empty">No videos yet. Upload one above!</p>';
                }
            } catch (e) {
                alert('Failed to clear videos');
            }
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const submitBtn = document.getElementById('submit-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressFill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');

            submitBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            statusText.textContent = 'Uploading...';
            progressFill.style.width = '0%';

            const formData = new FormData();
            formData.append('email', form.email.value);
            formData.append('file', form.file.files[0]);

            try {
                const res = await fetchWithAuth(`${API_BASE}/jobs`, {
                    method: 'POST',
                    body: formData
                });

                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }

                statusText.textContent = 'Processing video...';
                progressFill.style.width = '50%';

                const jobCard = document.createElement('div');
                jobCard.className = 'job-card status-pending';
                jobCard.dataset.jobId = data.job_id;
                jobCard.innerHTML = `
                    <div class="job-info">
                        <strong>${escapeHtml(data.filename)}</strong>
                        <span class="job-email">${escapeHtml(form.email.value)}</span>
                    </div>
                    <div class="job-status">
                        <span class="status-badge pending">pending</span>
                    </div>
                `;
                document.getElementById('jobs-list').prepend(jobCard);

                pollJobStatus(data.job_id);

                form.reset();
                statusText.textContent = 'Done!';
                progressFill.style.width = '100%';
            } catch (e) {
                alert('Error: ' + e.message);
                progressContainer.classList.add('hidden');
            } finally {
                submitBtn.disabled = false;
                setTimeout(() => progressContainer.classList.add('hidden'), 2000);
            }
        });

        loadJobs();
    </script>
</body>
</html>
