services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./app/database.db:/app/app/database.db
    restart: unless-stopped

  worker:
    build: .
    command: python worker.py
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./app/database.db:/app/app/database.db
    restart: unless-stopped
    depends_on:
      - web
